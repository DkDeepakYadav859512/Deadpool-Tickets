<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadpool</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Bowlby+One+SC&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <h1 id="back">DEADPOOL</h1>

        <nav>
            <div id="logo">
                <div id="logo1"></div>
                <div id="logo2"></div>
            </div>

            <div id="op">
                <a href="#">Home <span></span></a>
                <a href="#">Booking <span></span></a>
                <a href="#">Tickets <span></span></a>
                <a href="#">About <span></span></a>
                <a href="#">Socials <span></span></a>
            </div>

            <div id="icon">
                <div id="menu-btn" aria-label="Menu"><i class="ri-menu-fill"></i></div>
                <div aria-label="Search"><i class="ri-search-line"></i></div>
            </div>
        </nav>

        <section>
            <h1>DEADPOOL</h1>
            <img src="./img1.png" alt="Deadpool">
            <div class="btns">
                <button id="btn2">Tickets</button>
                <button id="btn1">Booking Now</button>
            </div>
        </section>
    </main>

    <script>
        
        const menuBtn = document.getElementById("menu-btn");
        const op = document.getElementById("op");
        menuBtn.addEventListener("click", () => op.classList.toggle("open"));
    </script>
</body>
</html>
